name: Weekly screener refresh

# Runs three times, all clustered right before Monday's market open:
# Sunday 9 PM IST, Monday 3 AM IST, Monday 4 AM IST. Three independent
# attempts mean Yahoo blocking Render's IP (an unofficial API, no SLA,
# has happened repeatedly) during one attempt doesn't cost the whole
# window - the next one a few hours later gets its own shot.
#
# Deliberately NOT a Saturday-night run: NSE occasionally holds special
# sessions on what would otherwise be a non-trading day (e.g. Diwali
# Muhurat trading), so "is Saturday actually a trading day this week" can
# be ambiguous. Checking from MONDAY sidesteps that entirely - the app
# evaluates the most recently FULLY COMPLETED week (keepOnlyCompletedWeeks
# in weeklyResample.js) by comparing calendar weeks, not by guessing
# whether a given weekend day traded. Once we're checking from Monday,
# we've unambiguously rolled into a new week, so whatever happened last
# week - a normal Mon-Fri, or a Saturday Muhurat session, or anything
# else - is automatically settled and correctly included, no special-
# casing needed.
#
# All three times land on SUNDAY in UTC, not Monday - IST is 5:30 ahead,
# so "Monday 3/4 AM IST" is still Sunday night UTC. Verified directly:
#   Sun 9:00 PM IST -> 2026-09-06T15:30:00Z (cron: 30 15 * * 0)
#   Mon 3:00 AM IST -> 2026-09-06T21:30:00Z (cron: 30 21 * * 0)
#   Mon 4:00 AM IST -> 2026-09-06T22:30:00Z (cron: 30 22 * * 0)
#
# This also doubles as a wake-up call for Render's free tier, which spins
# the service down after 15 minutes of no traffic - the request here
# brings it back up before running the refresh.
on:
  schedule:
    - cron: "30 15 * * 0" # Sunday 9 PM IST
    - cron: "30 21 * * 0" # Monday 3 AM IST
    - cron: "30 22 * * 0" # Monday 4 AM IST
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # A 200 response from POST /api/refresh only means the request was
      # accepted - it says nothing about whether the actual refresh (which
      # runs in the background) ever finished. This bit us for real: a
      # manually-triggered run showed "success" here while the live site's
      # data never actually updated. So this step doesn't stop at the
      # trigger - it watches /api/status until the refresh genuinely
      # completes with no error, and retries the whole attempt (up to 3
      # times) if it doesn't. If all 3 genuinely fail, the job itself
      # fails (exit 1) - an honest red X instead of a false green check.
      - name: Trigger and verify screener refresh
        run: |
          set -uo pipefail
          URL="https://manog-screener.onrender.com"
          MAX_ATTEMPTS=3
          POLL_INTERVAL=10
          MAX_POLLS=60  # ~10 minutes of polling per attempt

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Attempt $attempt of $MAX_ATTEMPTS: triggering refresh ==="
            curl -sf -X POST "$URL/api/refresh" \
              -w "\nHTTP %{http_code}\n" \
              --retry 3 --retry-delay 30 --max-time 120 || true

            success=false
            for poll in $(seq 1 "$MAX_POLLS"); do
              sleep "$POLL_INTERVAL"
              status=$(curl -sf "$URL/api/status" --max-time 30 2>/dev/null || echo '{}')
              refreshing=$(echo "$status" | jq -r '.refreshing // "unknown"')
              last_error=$(echo "$status" | jq -r '.lastError')
              echo "poll $poll/$MAX_POLLS: refreshing=$refreshing lastError=$last_error"

              if [ "$refreshing" = "false" ]; then
                if [ "$last_error" = "null" ]; then
                  echo "Refresh completed successfully."
                  success=true
                else
                  echo "Refresh finished but reported an error: $last_error"
                fi
                break
              fi
            done

            if [ "$success" = "true" ]; then
              exit 0
            fi

            echo "Attempt $attempt did not complete successfully."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting before retrying..."
              sleep 60
            fi
          done

          echo "All $MAX_ATTEMPTS attempts failed to complete a verified successful refresh."
          exit 1
