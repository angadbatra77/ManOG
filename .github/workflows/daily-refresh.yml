name: Weekly screener refresh

# Runs once a week, Sunday night IST - well clear of NSE trading hours in
# either direction, so there's zero risk of the job running late and
# bumping into Monday's market open. The app evaluates the most recently
# FULLY COMPLETED week (keepOnlyCompletedWeeks in weeklyResample.js); any
# point during Saturday/Sunday IST already sees last week's trading as
# finished, so Sunday night resolves to the same complete week Monday
# morning would have, with a wider safety margin.
# 15:30 UTC = 9:00 PM IST.
#
# This also doubles as a wake-up call for Render's free tier, which spins
# the service down after 15 minutes of no traffic - the request here
# brings it back up before running the refresh.
on:
  schedule:
    - cron: "30 15 * * 0"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger screener refresh
        run: |
          curl -sf -X POST "https://manog-screener.onrender.com/api/refresh" \
            -w "\nHTTP %{http_code}\n" \
            --retry 3 --retry-delay 30 --max-time 120
