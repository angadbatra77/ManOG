name: Weekly screener refresh

# Runs four times: twice on Saturday morning so the new list is ready for
# a weekend review, then twice more before Monday's open as a safety net.
# Multiple independent attempts matter because Yahoo blocks Render's IP
# intermittently (an unofficial API, no SLA, has happened repeatedly), so
# one attempt is not reliable enough on its own.
#
# SATURDAY 6 AM IST IS THE EARLIEST USEFUL TIME, and the constraint is not
# data availability - Yahoo has Friday's close within the hour. It is
# keepOnlyCompletedWeeks in weeklyResample.js, which only treats the
# current week as finished once isWeekendIST is true. That flips at
# Saturday 00:00 IST. A refresh any earlier re-runs the PREVIOUS week and
# returns the same list it already had.
#
# The Sunday and Monday runs are deliberately kept. NSE occasionally holds
# a special session on what would otherwise be a non-trading day (Diwali
# Muhurat trading), and if one lands on a Saturday, the 6 AM scan will have
# closed the week before it happened. The later runs re-scan once the
# calendar has unambiguously rolled into a new week, so that session gets
# picked up and the list corrects itself. Re-scanning is idempotent - the
# completed week is the same, so the stock list does not change, only the
# prices attached to it.
#
# Times land on SATURDAY and SUNDAY in UTC - IST is 5:30 ahead, so
# "Monday 3 AM IST" is still Sunday night UTC. Verified directly:
#   Sat 6:00 AM IST -> 2026-09-05T00:30:00Z (cron: 30 0 * * 6)
#   Sat 7:30 AM IST -> 2026-09-05T02:00:00Z (cron: 0 2 * * 6)
#   Sun 9:00 PM IST -> 2026-09-06T15:30:00Z (cron: 30 15 * * 0)
#   Mon 3:00 AM IST -> 2026-09-06T21:30:00Z (cron: 30 21 * * 0)
#
# This also doubles as a wake-up call for Render's free tier, which spins
# the service down after 15 minutes of no traffic - the request here
# brings it back up before running the refresh.
on:
  schedule:
    - cron: "30 0 * * 6" # Saturday 6:00 AM IST - the earliest that yields the new week
    - cron: "0 2 * * 6" # Saturday 7:30 AM IST - retry if Yahoo blocked the first
    - cron: "30 15 * * 0" # Sunday 9:00 PM IST - safety net, catches a Saturday session
    - cron: "30 21 * * 0" # Monday 3:00 AM IST - last chance before the open
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # A 200 response from POST /api/refresh only means the request was
      # accepted - it says nothing about whether the actual refresh (which
      # runs in the background) ever finished. This bit us for real: a
      # manually-triggered run showed "success" here while the live site's
      # data never actually updated. So this step doesn't stop at the
      # trigger - it watches /api/status until the refresh genuinely
      # completes with no error, and retries the whole attempt (up to 3
      # times) if it doesn't. If all 3 genuinely fail, the job itself
      # fails (exit 1) - an honest red X instead of a false green check.
      - name: Trigger and verify screener refresh
        run: |
          set -uo pipefail
          URL="https://manog-screener.onrender.com"
          MAX_ATTEMPTS=3
          POLL_INTERVAL=10
          MAX_POLLS=60  # ~10 minutes of polling per attempt

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Attempt $attempt of $MAX_ATTEMPTS: triggering refresh ==="
            curl -sf -X POST "$URL/api/refresh" \
              -w "\nHTTP %{http_code}\n" \
              --retry 3 --retry-delay 30 --max-time 120 || true

            success=false
            for poll in $(seq 1 "$MAX_POLLS"); do
              sleep "$POLL_INTERVAL"
              status=$(curl -sf "$URL/api/status" --max-time 30 2>/dev/null || echo '{}')
              # NOT `.refreshing // "unknown"` - jq's // treats false the
              # same as null, so a genuine `false` would silently become
              # the string "unknown" and never match the check below. Hit
              # this for real: a run sat "in_progress" for ~10+ minutes
              # after the actual refresh had already finished cleanly.
              refreshing=$(echo "$status" | jq -r '.refreshing | tostring')
              last_error=$(echo "$status" | jq -r '.lastError')
              echo "poll $poll/$MAX_POLLS: refreshing=$refreshing lastError=$last_error"

              if [ "$refreshing" = "false" ]; then
                if [ "$last_error" = "null" ]; then
                  echo "Refresh completed successfully."
                  success=true
                else
                  echo "Refresh finished but reported an error: $last_error"
                fi
                break
              fi
            done

            if [ "$success" = "true" ]; then
              exit 0
            fi

            echo "Attempt $attempt did not complete successfully."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting before retrying..."
              sleep 60
            fi
          done

          echo "All $MAX_ATTEMPTS attempts failed to complete a verified successful refresh."
          exit 1
